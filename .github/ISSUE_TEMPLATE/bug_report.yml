name: Bug or accessibility issue
description: Something is broken, confusing, or unusable with a keyboard or a screen reader.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Accessibility bugs are especially welcome — if something was hard to use with a screen reader or a keyboard, that is a bug in this game, not a mistake on your side.

  - type: textarea
    id: what-happened
    attributes:
      label: What were you doing?
      description: Which page or episode were you on, and what did you do? Steps are ideal, but a description is fine.
      placeholder: |
        1. Opened the Settings page in English
        2. Tabbed to the Text Speed options
        3. Pressed the right arrow key
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: If a screen reader announced something unexpected (or nothing at all), quote it as closely as you can.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the version if you know it.
      placeholder: macOS 15.2, Windows 11, Android 15
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Include the version if you know it.
      placeholder: Safari 18.2, Firefox 134, Chrome 132
    validations:
      required: true

  - type: dropdown
    id: screen-reader
    attributes:
      label: Screen reader
      description: Pick "None" if you were not using one.
      options:
        - VoiceOver
        - NVDA
        - JAWS
        - TalkBack
        - Narrator
        - Orca
        - None
        - Other
    validations:
      required: true

  - type: input
    id: screen-reader-version
    attributes:
      label: Screen reader version
      description: If you picked "Other" above, name it here too.
      placeholder: NVDA 2024.4
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Console errors, a recording, the save state you were in — whatever helps.
    validations:
      required: false
